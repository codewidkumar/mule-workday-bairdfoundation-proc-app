api:
    name: "baird-wday-sfdc-sync-app"

syncStatus:
    expirationInterval: "2"
    entryTTL: "6"

worker:
    batchSize: "2000"
    untilSuccessful:
        maxRetries: "3"
        interval: "2000"
    batchJobStatus:
        retryTime: "60000"
        retries: "12"

contact:
    batchSize: "2000"

account:
    batchSize: "200"

batch:
    setInactiveQuery: "200"
    empContacts: "1000"

graphAPI:
    members:
        method: "GET"
        path: "/api/v1/groups/{groupId}/members"
    email:
        method: "POST"
        path: "/api/v1/users/{userId}/send-email"
        untilSuccessful:
            maxRetries: "3"
            interval: "2000"
    request:
        maxConnections: "-1"
        connectionIdleTimeout: "30000"
        responseTimeout: "30000"
  
    
# Office type field mapping
